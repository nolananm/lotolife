<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Salles - LotoLife</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="admin-header">
        <h1>🛠️ LotoLife Admin</h1>
    </header>
    
    <nav style="text-align: center; margin: 2rem 0; gap: 15px; display: flex; justify-content: center;">
        <a href="admin.html"><button style="background-color: var(--text-dark);">🏢 1. Créer une Salle</button></a>
        <a href="admin-events.html"><button>🎟️ 2. Créer un Loto</button></a>
    </nav>
    
    <main>
        <section class="card">
            <h2>1. Nom de la Salle</h2>
            <input type="text" id="venueName" placeholder="Ex: Salle Polyvalente de Miremont" style="width: 100%; max-width: 500px;" required>
        </section>

        <section class="card">
            <h2>2. Disposer les Tables</h2>
            <p>Ajoute des tables. Les chaises seront réparties face à face.</p>
            
            <div style="display: flex; gap: 15px; flex-wrap: wrap; background: #eee; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <input type="text" id="tableNameInput" placeholder="Nom de la table (ex: Table A)" style="flex: 1; min-width: 200px;">
                <label style="display: flex; align-items: center; gap: 10px; font-weight: bold;">
                    Nombre de places : 
                    <input type="number" id="tableSeatsInput" value="12" min="2" step="2" style="width: 80px;">
                </label>
                <button id="addTableBtn" style="margin: 0; background-color: var(--loto-green);">+ Ajouter</button>
            </div>

            <div id="roomPlan" class="room-plan">
                <!-- Les tables apparaîtront ici -->
            </div>
            
            <button id="saveVenueBtn" style="margin-top: 2rem; width: 100%; padding: 1rem; font-size: 1.5rem;">💾 Enregistrer la salle et son plan</button>
        </section>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
