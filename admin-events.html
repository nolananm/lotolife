<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Lotos - LotoLife</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="admin-header">
        <h1>🎪 LotoLife Admin - Création de Lotos</h1>
    </header>
    
    <main>
        <section class="card">
            <h2>1. Créer un nouveau Loto</h2>
            <form id="eventForm" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="eventTitle" placeholder="Titre du Loto (ex: Loto de Noël)" required>
                
                <label>Salle pré-enregistrée : 
                    <select id="venueSelect" required style="padding: 0.5rem; width: 100%;">
                        <option value="">Chargement des salles...</option>
                    </select>
                </label>
                
                <label>Date du Loto : <input type="datetime-local" id="eventDate" required></label>
                <label>Ouverture des ventes : <input type="datetime-local" id="salesOpen" required></label>
                <label>Fermeture des ventes : <input type="datetime-local" id="salesClose" required></label>
                <label>Prix d'un carton (€) : <input type="number" step="0.5" id="cardPrice" value="5" required></label>
                
                <button type="submit">Créer le Loto</button>
            </form>
        </section>

        <!-- Cette section s'affiche une fois le loto créé -->
        <section class="card" id="categoriesSection" style="display: none;">
            <h2>2. Ajouter des Catégories de Places</h2>
            <p>Pour le Loto : <strong id="currentEventTitle"></strong></p>
            <form id="categoryForm" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="hidden" id="currentEventId">
                <input type="text" id="catName" placeholder="Nom (ex: C1 - Proche Scène)" required>
                <label>Couleur sur le plan : <input type="color" id="catColor" value="#ff0055"></label>
                <label>Supplément Prix place (€) : <input type="number" step="0.5" id="catPrice" value="0"></label>
                <button type="submit">Ajouter la Catégorie</button>
            </form>
            <ul id="categoriesList" style="margin-top: 15px; list-style: none; padding: 0;"></ul>
        </section>
    </main>

    <script type="module" src="admin-events.js"></script>
</body>
</html>
