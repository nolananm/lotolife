<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Lotos - LotoLife</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="admin-header">
        <h1>🛠️ LotoLife Admin</h1>
    </header>
    
    <!-- Menu de navigation Admin -->
    <nav style="text-align: center; margin: 2rem 0; gap: 15px; display: flex; justify-content: center;">
        <a href="admin.html"><button>🏢 1. Créer une Salle</button></a>
        <a href="admin-events.html"><button style="background-color: var(--text-dark);">🎟️ 2. Créer un Loto</button></a>
    </nav>
    
    <main>
        <section class="card">
            <h2>Créer un nouveau Loto</h2>
            <form id="eventForm" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" id="eventTitle" placeholder="Titre du Loto (ex: Super Loto de Noël)" required>
                
                <label style="font-weight: bold; color: var(--loto-blue);">Salle pré-enregistrée : 
                    <select id="venueSelect" required style="width: 100%;">
                        <option value="">Chargement des salles...</option>
                    </select>
                </label>
                
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <label style="flex: 1;">Date de l'événement : <br><input type="datetime-local" id="eventDate" required style="width: 90%;"></label>
                    <label style="flex: 1;">Prix d'un carton (€) : <br><input type="number" step="0.5" id="cardPrice" value="5" required style="width: 90%;"></label>
                </div>

                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <label style="flex: 1;">Ouverture des ventes : <br><input type="datetime-local" id="salesOpen" required style="width: 90%;"></label>
                    <label style="flex: 1;">Clôture des ventes : <br><input type="datetime-local" id="salesClose" required style="width: 90%;"></label>
                </div>
                
                <button type="submit" style="margin-top: 1rem; width: 100%; font-size: 1.5rem;">Mettre le Loto en ligne !</button>
            </form>
        </section>

        <section class="card" id="categoriesSection" style="display: none;">
            <h2>Catégories de Places (Optionnel)</h2>
            <p>Pour le Loto : <strong id="currentEventTitle"></strong></p>
            <form id="categoryForm" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="hidden" id="currentEventId">
                <input type="text" id="catName" placeholder="Nom (ex: Proche Animateur)" required>
                <label>Supplément Prix place (€) : <input type="number" step="0.5" id="catPrice" value="0"></label>
                <button type="submit">Ajouter la Catégorie</button>
            </form>
            <ul id="categoriesList" style="margin-top: 15px; list-style: none; padding: 0;"></ul>
        </section>
    </main>

    <script type="module" src="admin-events.js"></script>
</body>
</html>
