<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LotoLife - À chaque loto sa dose de sensations !</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styles spécifiques au client pour adoucir le côté cirque */
        .client-header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem;
            text-align: center;
            border-bottom: 5px solid var(--secondary-color);
        }
        .countdown-container {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 2rem 0;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px dashed var(--secondary-color);
        }
        .locked {
            opacity: 0.5;
            pointer-events: none;
            position: relative;
        }
        .locked::after {
            content: '🔒 Vente fermée';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.5rem;
        }
        #reservationArea {
            display: none; /* Masqué tant que la vente n'est pas ouverte */
        }
    </style>
</head>
<body>
    <header class="client-header">
        <h1>🎪 LotoLife</h1>
        <p>À chaque loto sa dose de sensations !</p>
    </header>
    
    <main>
        <div id="eventInfo" style="text-align: center; margin-bottom: 2rem;">
            <h2 id="displayEventTitle">Chargement du prochain Loto...</h2>
            <p id="displayEventDate"></p>
        </div>

        <!-- Zone du compte à rebours -->
        <div id="countdownArea" class="countdown-container" style="display: none;">
            Vente dans : <br>
            <span id="countdownTimer">--:--:--</span>
        </div>

        <!-- Zone de réservation (grisée/verrouillée ou active selon la date) -->
        <div id="reservationArea" class="card">
            <h3>1. Choisis tes places</h3>
            <div id="clientSeatGrid" class="seat-grid">
                <!-- Le plan généré depuis Supabase apparaîtra ici -->
            </div>

            <hr style="margin: 2rem 0;">

            <h3>2. Tes cartons & Snacks</h3>
            <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                <div>
                    <label>Nombre de cartons (<span id="displayCardPrice">0</span>€/unité) :</label><br>
                    <input type="number" id="cartonCount" value="1" min="1" style="width: 100px;">
                </div>
                <div>
                    <label>Snack Buvette (Pré-commande) :</label><br>
                    <select id="snackSelect">
                        <option value="">Aucun snack</option>
                        <option value="croque">Croque-Monsieur + Boisson (5€)</option>
                        <option value="crepe">Crêpe + Boisson (4€)</option>
                    </select>
                </div>
            </div>

            <hr style="margin: 2rem 0;">

            <h3>3. Réservation</h3>
            <form id="bookingForm">
                <input type="text" id="clientName" placeholder="Ton Nom" required>
                <input type="email" id="clientEmail" placeholder="Ton Email" required>
                <div style="font-size: 1.5rem; margin: 1rem 0;">
                    Total : <strong id="totalPrice">0.00</strong> €
                </div>
                <button type="submit" style="width: 100%;">Confirmer et Payer</button>
            </form>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
