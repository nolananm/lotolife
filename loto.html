<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LotoLife - À chaque loto sa dose de sensations !</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="client-header">
        <h1>🎱 LotoLife 🎁</h1>
        <p style="font-family: 'Poppins', sans-serif; font-size: 1.2rem; margin: 0; text-shadow: 1px 1px 0 #000;">À chaque loto sa dose de sensations !</p>
    </header>

    <main>
        <div id="eventInfo" style="text-align: center; margin-bottom: 2rem; background: white; padding: 1rem; border-radius: 50px; border: 3px solid var(--text-dark); box-shadow: 4px 4px 0 var(--secondary-color);">
            <h2 id="displayEventTitle" style="margin:0;">Chargement du tirage...</h2>
            <p id="displayEventDate" style="margin: 5px 0 0 0; font-weight: bold;"></p>
        </div>

        <div id="countdownArea" class="countdown-container" style="display: none;">
            <h3 style="color: white; text-shadow: none; margin-bottom: 10px;">Ouverture de la billetterie dans :</h3>
            <span id="countdownTimer">--:--:--</span>
        </div>

        <div id="reservationArea" class="card">
            <h3>🎟️ 1. Choisis tes places</h3>
            <p>Sélectionne tes jetons directement sur le plan de la salle.</p>
            <div id="clientSeatGrid" class="seat-grid">
                <!-- Le plan généré depuis Supabase apparaîtra ici -->
            </div>

            <hr style="margin: 2rem 0; border: 1px dashed var(--text-dark);">

            <h3>🎯 2. Tes cartons & Snacks</h3>
            <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px;">
                    <label>Nombre de cartons (<span id="displayCardPrice">0</span>€/unité) :</label><br>
                    <input type="number" id="cartonCount" value="1" min="1" style="width: 100%; font-size: 1.2rem; text-align: center;">
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label>Snack Buvette (Pré-commande) :</label><br>
                    <select id="snackSelect" style="width: 100%;">
                        <option value="">Je choisis sur place</option>
                        <option value="croque">Croque-Monsieur + Boisson (5€)</option>
                        <option value="crepe">Crêpe + Boisson (4€)</option>
                    </select>
                </div>
            </div>

            <hr style="margin: 2rem 0; border: 1px dashed var(--text-dark);">

            <h3>💰 3. Réservation</h3>
            <form id="bookingForm" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="clientName" placeholder="Ton Prénom et Nom" required>
                <input type="email" id="clientEmail" placeholder="Ton Adresse Email" required>
                <div style="font-size: 1.8rem; margin: 1rem 0; text-align: center; color: var(--primary-color); font-family: 'Luckiest Guy', cursive; text-shadow: 1px 1px 0 var(--secondary-color);">
                    Total : <strong id="totalPrice">0.00</strong> €
                </div>
                <button type="submit">Valider mes cartons</button>
            </form>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
